name: Verify and publish course

on:
  push:
  pull_request:

permissions:
  contents: read
  pages: write
  id-token: write

# El grupo lleva la referencia: con un grupo constante, abrir un pull request
# cancelaba el despliegue de main que estuviera en vuelo.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # Guardas de regresión del contenido: todo archivo de imagen tiene fila en
  # CREDITOS.md y todo SVG coincide con lo que su generador produce hoy.
  checks:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - run: pip install pytest pillow pyyaml
      - run: python -m pytest tools/ -q

  # `needs: checks` es lo que convierte las pruebas en una compuerta real. Sin
  # esa línea ambos trabajos corren en paralelo y el sitio se publica aunque la
  # suite falle.
  # Corre tambien en los pull requests de forks: el trabajo util ahi es
  # `raya validate`, que atrapa un curso roto antes del merge. El despliegue no
  # es problema, porque el workflow reusable ya lo filtra por su cuenta a un
  # push sobre la rama default.
  course-pages:
    needs: checks
    uses: raya-lucaria/raya-lucaria.github.io/.github/workflows/reusable-course-pages.yml@838c2af9eba0fd102e6027e109d43d2d02eda50d
    with:
      course_path: .
    permissions:
      contents: read
      pages: write
      id-token: write
